<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadea Chat</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <style>
        html, body { height: 100%; }
        body { overscroll-behavior: none; }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        .skeleton { animation: pulse-soft 1.2s ease-in-out infinite; background: #e5e7eb; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 9999px;
            animation: spin 0.7s linear infinite;
        }

        /* Mobile : liste OU chat */
        @media (max-width: 767px) {
            #contactsPanel.mobile-hidden { display: none !important; }
            #chatPanel.mobile-hidden { display: none !important; }
            #iconRail { display: none !important; }
            #mobileNav { display: flex !important; }
        }
        @media (min-width: 768px) {
            #mobileNav { display: none !important; }
            #contactsPanel, #chatPanel { display: flex !important; }
            #backToContacts { display: none !important; }
        }
    </style>
</head>

<body class="bg-gray-100 h-[100dvh] overflow-hidden">

<div class="flex h-[100dvh] overflow-hidden">

    <!-- Barre icônes (desktop) -->
    <aside id="iconRail" class="hidden md:flex w-16 shrink-0 bg-[#111b21] flex-col justify-between items-center py-6 z-10">
        <nav class="flex flex-col items-center gap-6">
            <a href="chat.html"
                class="flex items-center justify-center w-10 h-10 rounded-lg text-white bg-white/10"
                title="Discussions">
                <i class="fa-solid fa-comments text-lg"></i>
            </a>
            <a href="#"
                class="flex items-center justify-center w-10 h-10 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition"
                title="Appels">
                <i class="fa-solid fa-phone text-lg"></i>
            </a>
            <a href="prorfil.html"
                class="flex items-center justify-center w-10 h-10 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition"
                title="Profil">
                <i class="fa-solid fa-user text-lg"></i>
            </a>
        </nav>

        <button id="logoutBtn"
            class="flex items-center justify-center w-10 h-10 rounded-lg text-red-400 hover:text-red-300 hover:bg-white/10 transition"
            title="Déconnexion"
            type="button">
            <i class="fa-solid fa-right-from-bracket text-lg"></i>
        </button>
    </aside>

    <!-- Liste contacts -->
    <aside id="contactsPanel" class="w-full md:w-80 shrink-0 bg-white border-r flex flex-col min-h-0 pb-14 md:pb-0">

        <div class="p-4 sm:p-5 border-b shrink-0">
            <div class="flex items-center justify-between gap-3">
                <h2 id="currentUserName" class="text-lg sm:text-xl font-bold text-blue-600 truncate"></h2>
                <span id="syncBadge" class="hidden text-[10px] uppercase tracking-wide text-blue-500 font-semibold">Sync</span>
            </div>

            <input
                id="searchInput"
                type="search"
                placeholder="Rechercher un contact..."
                class="mt-3 sm:mt-4 w-full border rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div id="conversationList" class="flex-1 overflow-y-auto min-h-0">
            <!-- skeletons injectés par JS -->
        </div>

    </aside>

    <!-- Zone chat -->
    <main id="chatPanel" class="flex-1 flex-col min-w-0 min-h-0 mobile-hidden md:flex hidden pb-14 md:pb-0">

        <header class="bg-white h-14 sm:h-16 border-b flex items-center justify-between px-3 sm:px-6 shrink-0 gap-2">

            <div class="flex items-center gap-2 min-w-0 flex-1">
                <button id="backToContacts"
                    type="button"
                    class="md:hidden shrink-0 w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600"
                    title="Retour">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <div id="chatHeaderInfo" class="flex items-center gap-3 min-w-0 hidden">
                    <div id="receiverAvatar" class="shrink-0 w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center text-sm font-semibold text-gray-600"></div>
                    <div class="min-w-0">
                        <h2 id="receiverName" class="font-bold truncate text-sm sm:text-base"></h2>
                        <p id="receiverStatus" class="text-xs sm:text-sm text-green-500">● En ligne</p>
                    </div>
                </div>
            </div>

            <div class="hidden sm:flex items-center gap-5 text-gray-500 shrink-0">
                <button type="button" title="Appel vidéo" class="hover:text-blue-600">
                    <i class="fa-solid fa-video"></i>
                </button>
                <button type="button" title="Appel" class="hover:text-blue-600">
                    <i class="fa-solid fa-phone"></i>
                </button>
                <button type="button" title="Plus" class="hover:text-blue-600">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>

        </header>

        <section
            id="messages"
            class="flex-1 overflow-y-auto bg-white p-3 sm:p-6 space-y-3 min-h-0">

            <div class="text-center text-gray-500 mt-10 text-sm px-4">
                Choisissez un contact pour commencer à discuter.
            </div>

        </section>

        <form
            id="messageForm"
            class="bg-white border-t p-2.5 sm:p-4 flex items-center gap-2 sm:gap-3 shrink-0 safe-area-pb">

            <button type="button" class="hidden sm:inline-flex text-gray-500 text-xl hover:text-blue-600" title="Émoji">
                <i class="fa-regular fa-face-smile"></i>
            </button>

            <button type="button" class="hidden sm:inline-flex text-gray-500 text-xl hover:text-blue-600" title="Pièce jointe">
                <i class="fa-solid fa-paperclip"></i>
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="Tapez votre message..."
                disabled
                autocomplete="off"
                class="flex-1 border rounded-full px-4 sm:px-5 py-2.5 sm:py-3 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50 disabled:text-gray-400">

            <button
                id="sendBtn"
                type="submit"
                disabled
                class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white w-11 h-11 sm:w-12 sm:h-12 rounded-full flex items-center justify-center shrink-0">
                <i class="fa-solid fa-paper-plane"></i>
            </button>

        </form>

    </main>

</div>

<!-- Nav mobile bas -->
<nav id="mobileNav" class="hidden fixed bottom-0 inset-x-0 h-14 bg-[#111b21] text-gray-400 items-center justify-around z-20 border-t border-white/10 pb-[env(safe-area-inset-bottom)]">
    <a href="chat.html" class="flex flex-col items-center gap-0.5 text-white text-xs">
        <i class="fa-solid fa-comments text-lg"></i>
        <span>Chats</span>
    </a>
    <a href="prorfil.html" class="flex flex-col items-center gap-0.5 text-xs hover:text-white">
        <i class="fa-solid fa-user text-lg"></i>
        <span>Profil</span>
    </a>
    <button id="logoutBtnMobile" type="button" class="flex flex-col items-center gap-0.5 text-xs text-red-400">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
        <span>Sortir</span>
    </button>
</nav>

<script src="js/config.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
